name: CI/CD for DEV Environment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$TARBALL" "$BASE/$TARBALL"
          curl -sSfL -o checksums.txt "$BASE/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${TARBALL}$" checksums.txt | sha256sum -c -
          tar -xzf "$TARBALL" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history for secrets
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks-report.sarif

      - name: Upload gitleaks report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### :white_check_mark: Secret scan passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### :x: Secret scan failed — deploy blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Download the **gitleaks-report** artifact, remove the secret from the code and **rotate it** (it is already in git history)." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Define environment variables from REACT_ENV_FILE_DEV
        run: |
          rm -f .env
          echo "${{ secrets.REACT_ENV_FILE_DEV }}" > .env

      - name: Install dependencies
        run: npm install --force --no-audit --no-fund

      - name: Build React app
        run: CI=false npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          {
            echo "### :package: Build passed"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Total size | $(du -sh dist | cut -f1) |"
            echo "| Files | $(find dist -type f | wc -l) |"
            echo "| JS bundles | $(find dist -name '*.js' | wc -l) |"
            echo "| Largest JS | $(find dist -name '*.js' -printf '%s %f\n' | sort -nr | head -1 | awk '{printf "%s (%.0f KB)", $2, $1/1024}') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove env file
        if: always()
        run: rm -f .env

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-dev
          path: dist
          retention-days: 3

  deploy-fe:
    name: Deploy to DEV
    needs: [secret-scan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-dev
          path: dist

      - name: Create PEM file from Secret
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem

      - name: Zip dist with timestamp
        run: |
          TIMESTAMP=$(date +"%Y%m%d%H%M%S")
          ZIP_NAME="build-$TIMESTAMP.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

          if [ ! -d "dist" ]; then
            echo "dist folder not found!"
            exit 1
          fi

          cd dist
          zip -r "../$ZIP_NAME" .
          cd ..

      - name: Upload zipped build to EC2
        run: |
          scp -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no "$ZIP_NAME" \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/

      - name: Deploy on EC2 (create dirs + perms + deploy + rollback)
        run: |
          ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -euo pipefail

            ZIP_NAME=${{ env.ZIP_NAME }}
            HTML_DIR="/var/www/html-dev"
            BACKUP_DIR="/var/www/html-dev-backups"
            TEMP_DIR="/tmp/html-dev-new"

            echo "[INFO] Ensuring directories exist..."
            sudo mkdir -p "$HTML_DIR"
            sudo mkdir -p "$BACKUP_DIR"
            sudo mkdir -p "$TEMP_DIR"

            echo "[INFO] Setting permissions on directories..."
            sudo chown -R $USER:$USER "$HTML_DIR"
            sudo chown -R $USER:$USER "$BACKUP_DIR"
            sudo chown -R $USER:$USER "$TEMP_DIR"

            echo "[INFO] Checking unzip installation..."
            if ! command -v unzip &>/dev/null; then
              sudo apt-get update && sudo apt-get install -y unzip
            fi

            echo "[INFO] Unzipping new build to temp dir..."
            if ! sudo unzip -o "/tmp/$ZIP_NAME" -d "$TEMP_DIR"; then
              echo "[ERROR] Failed to unzip. Aborting."
              exit 1
            fi

            TS=$(date +"%Y%m%d%H%M%S")

            # Backup current live build
            if [ -d "$HTML_DIR" ]; then
              echo "[INFO] Backing up current build..."
              sudo mv "$HTML_DIR" "$BACKUP_DIR/html-dev-$TS"
            fi

            # Move new build live, and rollback on failure
            echo "[INFO] Moving new build to dev directory..."
            if sudo mv "$TEMP_DIR" "$HTML_DIR"; then
              echo "[SUCCESS] Deployed new build."
            else
              echo "[ERROR] Failed to move new build to dev."
              echo "[ROLLBACK] Reverting to last backup..."

              LATEST_BACKUP=$(ls -td $BACKUP_DIR/html-dev-* 2>/dev/null | head -n 1)
              if [ -n "$LATEST_BACKUP" ]; then
                sudo mv "$LATEST_BACKUP" "$HTML_DIR"
                echo "[ROLLBACK] Successfully restored backup."
              else
                echo "[FATAL] No backup found for rollback."
              fi

              exit 1
            fi

            # Set ownership of deployed folder again for safety
            sudo chown -R $USER:$USER "$HTML_DIR"

            # Clean old backups (keep latest 3)
            cd "$BACKUP_DIR"
            sudo ls -1tr | head -n -3 | xargs -d '\n' -r sudo rm -rf
          EOF

      - name: Deployment summary
        run: |
          echo "### :rocket: Deployed to DEV" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`${GITHUB_SHA::7}\` → \`/var/www/html-dev\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up key and ZIP file
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key.pem
          [ -n "${ZIP_NAME:-}" ] && rm -f "$ZIP_NAME" || true
